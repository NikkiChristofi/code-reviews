services:
  api:
    build:
      context: .
      # Dev mode: use the `deps` stage (all workspace deps installed, no
      # production build) and run the API under tsx watch against the
      # bind-mounted source. The `api` stage in the Dockerfile is the
      # production build if you ever need it.
      target: deps
    container_name: code-reviews-api
    command: ["sh", "/app/docker/api-dev-entrypoint.sh"]
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DATABASE_URL: "file:/data/app.db"
      CORS_ORIGIN: "http://localhost:3000"
    volumes:
      # Live source from the host: edits restart the API automatically.
      - ./apps/api:/app/apps/api
      - ./docker:/app/docker:ro
      - sqlite-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      # First start also generates the Prisma client and ingests ~75k rows.
      start_period: 40s

  web:
    build:
      context: .
      # Dev mode: use the `deps` stage (all workspace deps installed, no
      # production build) and run `next dev` against the bind-mounted source.
      target: deps
    container_name: code-reviews-web
    command:
      [
        "npm",
        "run",
        "dev",
        "-w",
        "apps/web",
        "--",
        "--hostname",
        "0.0.0.0",
        "--port",
        "3000",
      ]
    ports:
      - "3000:3000"
    volumes:
      # Live source from the host: edits show up immediately via hot reload.
      - ./apps/web:/app/apps/web
      # Keep the container's own node_modules and build cache rather than
      # the host's (macOS binaries won't run in the Linux container).
      - /app/apps/web/node_modules
      - /app/apps/web/.next
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      # Server-side requests go over the compose network to the api container.
      GRAPHQL_URL: "http://api:4000/graphql"
      # Browser-side requests go to the host-published port.
      NEXT_PUBLIC_GRAPHQL_URL: "http://localhost:4000/graphql"
    depends_on:
      api:
        condition: service_healthy

volumes:
  sqlite-data:
